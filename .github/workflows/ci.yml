name: CI
on:
  pull_request:
  # Also run by deploy.yml before every deploy.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Started days unchanged from the live site
        run: npm run content:check-pushed
      - run: npm run build

  # One job per browser, in parallel.
  e2e:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled, rather than installed on every run.
    # The tag must match @playwright/test (checked by tests/unit/ci.test.ts).
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.project }}
