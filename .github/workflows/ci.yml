name: CI
on:
  pull_request:
  # Also run by deploy.yml before every deploy.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Started days unchanged from the live site
        run: npm run content:check-pushed
        env:
          # First deploy of the locks only; remove once they're live.
          STUMPED_LOCKS_UNPUBLISHED: "1"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
