name: CI
on:
  pull_request:
  # Also run by deploy.yml before every deploy.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Started days unchanged from the live site
        run: npm run content:check-pushed
      - run: npm run build

  # One job per browser, in parallel: each installs only its own browser.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers are cached per Playwright version; their system libraries still need installing.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
